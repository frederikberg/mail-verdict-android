name: Release

# A tag `vX.Y.Z` publishes a GitHub Release carrying the signed APK, with the matching CHANGELOG.md
# section as its notes. The tag goes on the merge commit of the release pull request, after its
# `CI ok` is green.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag, appVersionName and CHANGELOG.md agree
        run: tooling/check_release_versions.sh "$GITHUB_REF_NAME"
      - name: The release notes are not empty
        run: tooling/extract_changelog.sh "$GITHUB_REF_NAME" > /dev/null

  publish:
    name: Build and publish
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      # No Gradle cache and no configuration cache: the signing password is a build input, and
      # neither may keep a copy of it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the signed APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew --console=plain --no-configuration-cache :app:assembleRelease

      - name: Check the APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt2" dump badging "$apk" | tee "$RUNNER_TEMP/badging.txt" | head -1
          grep -q "versionName='${GITHUB_REF_NAME#v}'" "$RUNNER_TEMP/badging.txt"
          mv "$apk" "mail-verdict-$GITHUB_REF_NAME.apk"

      - name: Cut the release notes from CHANGELOG.md
        run: tooling/extract_changelog.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v3
        with:
          files: mail-verdict-${{ github.ref_name }}.apk
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Remove the keystore
        if: always()
        run: find "$RUNNER_TEMP" -maxdepth 1 -name release.keystore -delete
