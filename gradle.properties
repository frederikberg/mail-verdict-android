org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# The one place the app version is written: versionCode is derived from it, the release workflow
# checks the tag against it, and tooling/check_release_versions.sh reads it.
appVersionName=0.1.0
